<<div th:replace="~{base :: html}"> <div th:fragment="content" class="container mt-5">
    <h2>Votre Panier</h2>
    <table class="table">
        <thead>
        <tr>
            <th>Produit</th>
            <th>Prix Unitaire</th>
            <th>Quantité</th>
            <th>Total</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="ligne : ${lignes}">
            <td th:text="${ligne.key.nom}">Nom</td>
            <td th:text="${ligne.key.prix} + ' €'">0 €</td>
            <td th:text="${ligne.value}">1</td>
            <td th:text="${ligne.key.prix * ligne.value} + ' €'">0 €</td>
        </tr>
        </tbody>
    </table>
    <h3 class="text-end">Total à payer : <span th:text="${total} + ' €'"></span></h3>
    <div class="text-center mt-4">
        <a th:href="@{/ecommerce}" class="btn btn-primary">Continuer mes achats</a>
    </div>
</div>
</div>
