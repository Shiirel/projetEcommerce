<div class="container">
    <h1>Notre Blog</h1>
    <div th:each="b : ${articlesBlog}" class="card mb-3">
        <div class="card-body">
            <h2 th:text="${b.titre}">Titre</h2>
            <p class="text-muted">
                Publié le <span th:text="${b.datePublication}">01/01/2026</span>
                par <strong><span th:text="${b.auteur.nom}">Nom de l'auteur</span></strong>
            </p>
            <p th:text="${b.contenu}">Contenu de l'article...</p>
        </div>
    </div>
</div>
